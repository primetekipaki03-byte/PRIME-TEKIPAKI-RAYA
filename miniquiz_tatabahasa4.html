<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Tata Bahasa Unit 3: ~そうです（様態） / ~そうです（伝聞） / ~すぎる</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --navy:#001f3f;
    --navy2:#002a54;
    --gold:#facc15;
    --gold-soft:#fff3c4;
    --paper:#fffdf7;
    --text:#001f3f;
    --muted:#5b6b7d;
    --green:#16a34a;
    --red:#dc2626;
    --blue:#1d4ed8;
}

*{ margin:0; padding:0; box-sizing:border-box; font-family:"Poppins","Segoe UI",Arial,sans-serif; }
body{ background:#f6f5f1; color:var(--text); padding-bottom:50px; }
.jp{ font-family:"Noto Sans JP","Segoe UI",Arial,sans-serif; }

#navbar{
    position:sticky; top:0; z-index:999;
    background:#001530;
    border-bottom:2px solid rgba(250,204,21,.25);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.navbar-inner{ display:flex; justify-content:space-between; align-items:center; padding:12px 20px; flex-wrap:wrap; gap:10px; }
.nav-title{ color:var(--gold); font-weight:700; font-size:15px; letter-spacing:.02em; }

header{ text-align:center; padding:26px 20px 8px; }
.eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--navy); color:var(--gold);
    font-size:12.5px; font-weight:600; letter-spacing:.1em;
    padding:7px 16px; border-radius:999px; margin-bottom:16px;
}
header h1{ font-size:30px; color:var(--navy); margin-bottom:8px; letter-spacing:-.01em; }
header p{ font-size:14px; color:var(--muted); max-width:600px; margin:0 auto; line-height:1.6; }

.grammar-tabs{ max-width:900px; margin:26px auto 0; padding:0 20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.gtab{
    border:2px solid var(--navy); background:white; color:var(--navy);
    padding:10px 22px; border-radius:999px; font-weight:700; font-size:16px;
    cursor:pointer; font-family:"Noto Sans JP",sans-serif;
}
.gtab:hover{ background:var(--gold-soft); }
.gtab.active{ background:var(--navy); color:var(--gold); }

.grammar-section{ display:none; max-width:900px; margin:0 auto; padding:0 20px; }
.grammar-section.active{ display:block; }

.gram-intro{
    background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:14px;
    padding:14px 18px; margin-top:22px; font-size:13.5px; color:#5a4a00; line-height:1.6;
}

.conj-table-wrap{ margin-top:18px; }
.conj-table-title{ font-size:14px; font-weight:700; color:var(--navy); margin-bottom:4px; }
.conj-table-rule{ font-size:13px; color:var(--muted); margin-bottom:12px; }
.conj-table{ width:100%; border-collapse:separate; border-spacing:0; background:white; border:1.5px solid #e2ddcf; border-radius:12px; overflow:hidden; }
.conj-table th{ background:var(--navy); color:var(--gold); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; padding:10px 12px; text-align:left; }
.conj-table td{ padding:9px 12px; font-size:14px; border-top:1px solid #eee; vertical-align:top; }
.conj-gol-cell{ font-weight:700; color:var(--navy); font-size:12.5px; white-space:nowrap; }
.conj-note-cell{ font-size:12px; color:var(--muted); }
.conj-examples{ display:flex; flex-direction:column; gap:4px; }
.conj-ex-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.conj-ex-row .arrow{ color:var(--muted); font-size:12px; }
.conj-ex-row .final{ font-weight:700; color:var(--green); }

.subtab-row{ display:flex; gap:8px; margin-top:22px; flex-wrap:wrap; }
.subtab{
    border:2px solid #d8d4c8; background:white; color:var(--muted);
    padding:9px 16px; border-radius:12px 12px 0 0; font-weight:600; font-size:13.5px; cursor:pointer;
}
.subtab:hover{ color:var(--navy); }
.subtab.active{ border-color:var(--navy); background:var(--navy); color:var(--gold); }

.subpanel{ display:none; background:white; border:2px solid var(--navy); border-radius:0 14px 14px 14px; padding:26px; }
.subpanel.active{ display:block; }

/* ===== PG (quiz card) ===== */
.progress-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
.progress-text{ font-size:13px; font-weight:600; color:var(--navy); white-space:nowrap; }
.progress-bar{ flex:1; height:6px; background:#e3e0d6; border-radius:999px; margin:0 14px; overflow:hidden; min-width:80px; }
.progress-fill{ height:100%; background:var(--gold); border-radius:999px; transition:width .35s ease; }

.card{
    background:var(--paper); border:2px solid var(--navy); box-shadow:0 6px 0 var(--navy);
    border-radius:22px; padding:38px 28px; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; text-align:center; width:100%;
}
.badge{
    width:40px; height:40px; border-radius:50%; background:var(--gold-soft);
    border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-size:18px; margin-bottom:12px;
}
.word{ font-size:clamp(22px, 5vw, 32px); font-weight:900; color:var(--navy); line-height:1.6; word-break:break-word; }
.subtext{ margin-top:8px; font-size:14px; color:var(--muted); max-width:520px; }

.options-grid{ margin-top:26px; display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; }
.opt-btn{
    border:2px solid #d8d4c8; background:white; color:var(--navy);
    padding:15px 14px; border-radius:14px; font-weight:600; font-size:16px;
    cursor:pointer; text-align:center; transition:.15s;
    display:flex; align-items:center; justify-content:center; gap:8px;
}
.opt-btn .opt-letter{
    width:22px; height:22px; border-radius:50%; border:1.5px solid var(--navy);
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.opt-btn:hover:not(:disabled){ border-color:var(--navy); background:var(--gold-soft); }
.opt-btn:disabled{ cursor:default; }
.opt-btn.correct{ background:#e8f8ee; border-color:var(--green); color:var(--green); }
.opt-btn.correct .opt-letter{ background:var(--green); border-color:var(--green); color:white; }
.opt-btn.wrong{ background:#fdecec; border-color:var(--red); color:var(--red); }
.opt-btn.wrong .opt-letter{ background:var(--red); border-color:var(--red); color:white; }
.opt-btn.dim{ opacity:.5; }

.feedback{ margin-top:16px; font-size:13.5px; font-weight:700; padding:8px 16px; border-radius:999px; display:none; }
.feedback.show{ display:inline-block; }
.feedback.correct-fb{ background:#e8f8ee; color:var(--green); }
.feedback.wrong-fb{ background:#fdecec; color:var(--red); }

.nav-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:22px; flex-wrap:wrap; }
.nav-btn{
    width:44px; height:44px; border-radius:50%; border:2px solid var(--navy);
    background:white; color:var(--navy); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.2s;
}
.nav-btn:hover{ background:var(--navy); color:var(--gold); }
.nav-btn:disabled{ opacity:.3; cursor:default; }
.nav-btn:disabled:hover{ background:white; color:var(--navy); }
.reset-btn{
    border-radius:999px; width:auto; padding:0 18px; font-size:12.5px; font-weight:600; gap:6px;
    border:2px solid var(--gold); background:var(--navy); color:var(--gold);
}
.reset-btn:hover{ background:var(--gold); color:var(--navy); }

.jump-row{ display:flex; justify-content:center; flex-wrap:wrap; gap:7px; margin-top:20px; }
.dot{
    width:32px; height:32px; border-radius:8px; border:2px solid #d8d4c8; background:white;
    color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.2s;
}
.dot:hover{ border-color:var(--navy); }
.dot.active{ background:var(--navy); border-color:var(--navy); color:var(--gold); }
.dot.correct{ border-color:var(--green); color:var(--green); }
.dot.wrong{ border-color:var(--red); color:var(--red); }
.dot.active.correct, .dot.active.wrong{ color:var(--gold); }

.pg-score{ text-align:center; font-size:13.5px; font-weight:700; color:var(--navy); margin-top:14px; }

/* ===== Esai & Merubah kalimat ===== */
.item-list{ display:flex; flex-direction:column; gap:14px; }
.item-card{ border:1.5px solid #e2ddcf; border-radius:14px; padding:16px 18px; background:#fffefb; }
.item-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; background:var(--navy); color:var(--gold);
    font-size:12px; font-weight:700; margin-right:8px; flex-shrink:0;
}
.item-prompt{ font-size:15px; font-weight:600; color:var(--navy); display:flex; align-items:flex-start; gap:2px; line-height:1.6; }
.item-sentences{ margin-top:10px; margin-left:34px; font-size:14.5px; color:var(--text); line-height:1.8; }
.item-sentences span{ display:block; }
.item-textarea{
    width:100%; margin-top:10px; border:1.5px solid #d8d4c8; border-radius:10px;
    padding:10px 12px; font-size:14px; font-family:inherit; resize:vertical; min-height:44px;
}
.item-textarea:focus{ outline:none; border-color:var(--navy); }
.reveal-btn{
    margin-top:10px; margin-left:34px; border:1.5px solid var(--blue); background:#eef4ff; color:var(--blue);
    padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer;
}
.reveal-btn:hover{ background:var(--blue); color:white; }
.answer-box{
    display:none; margin-top:10px; margin-left:34px; background:#e8f8ee; border:1.5px solid var(--green);
    color:#0f5c30; border-radius:10px; padding:10px 14px; font-size:14.5px; line-height:1.6;
}
.answer-box.show{ display:block; }

footer{ text-align:center; padding:50px 20px 30px; color:#8a93a0; font-size:14px; }

@media(max-width:480px){
    .options-grid{ grid-template-columns:1fr; }
    header h1{ font-size:22px; }
    .card{ padding:28px 16px; }
    .item-sentences, .reveal-btn, .answer-box{ margin-left:0; }
}
</style>
</head>

<h1>Latihan ~そうです（様態） ・ ~そうです（伝聞） ・ ~すぎる</h1>
<p>Setiap pola punya 10 soal pilihan ganda, 10 soal esai, dan 10 soal merubah kalimat. Pilih pola tata bahasa dan jenis soal di bawah ini.</p>

<script>

const DATA = {

        table: {
            rule: "い形容詞: hilangkan い + そうです（いい→よさそうです、ない→なさそうです）。な形容詞: langsung + そうです。動詞: hilangkan ます + そうです.",
            rows: [

            {word:"空が暗くて、雨が降り___。", sub:"Pilih bentuk yang tepat.", options:["そうです","ます","そう","ました"], answer:0},

        essay: [
            {cue:"おいしいです（このケーキ）", sentence:"このケーキは＿＿＿＿。", answer:"おいしそうです"},

            {cue:"忙しいです（田中さん）", sentence:"田中さんは＿＿＿＿。", answer:"忙しそうです"},
            {cue:"元気です（山田さん）", sentence:"山田さんは＿＿＿＿。", answer:"元気そうです"},
            {cue:"壊れます（この椅子）", sentence:"この椅子は＿＿＿＿。", answer:"壊れそうです"},

            {cue:"面白いです（この映画）", sentence:"この映画は＿＿＿＿。", answer:"面白そうです"},

            {parts:["この映画は面白いです。（見て感じたこと）"], answer:"この映画は面白そうです。"},

            {word:"友達の話によると、あの店はとても＿＿＿そうです。", sub:"Pilih bentuk yang tepat (dasar kata: おいしい).", options:["おいしそう","おいし","おいしい","おいしかった"], answer:2},
            {word:"天気予報によると、来週は＿＿＿そうです。", sub:"Pilih bentuk yang tepat (dasar kata: 寒い).", options:["寒く","寒い","寒そう","寒かった"], answer:1},

            {word:"ニュースによると、昨日、事故が＿＿＿そうです。", sub:"Pilih bentuk yang tepat (dasar kata: あります／past).", options:["ある","あって","あります","あった"], answer:3},

            {word:"友達の話によると、彼は試験に＿＿＿そうです。", sub:"Pilih bentuk yang tepat (dasar kata: 落ちます／past).", options:["落ちる","落ち","落ちて","落ちた"], answer:3},
            {word:"話によると、先週はとても＿＿＿そうです。", sub:"Pilih bentuk yang tepat (dasar kata: 忙しい／past).", options:["忙しい","忙しく","忙しそう","忙しかった"], answer:3},
            {word:"うわさによると、隣の人は＿＿＿そうです。", sub:"Pilih bentuk yang tepat (dasar kata: 引っ越します).", options:["引っ越し","引っ越して","引っ越した","引っ越す"], answer:3}
        ],
        essay: [
            {cue:"雨が降ります（天気予報）", sentence:"天気予報によると、明日は＿＿＿＿。", answer:"雨が降るそうです"},
            {cue:"おいしいです（あの店・友達の話）", sentence:"友達の話によると、あの店はとても＿＿＿＿。", answer:"おいしいそうです"},
            {cue:"寒いです（来週・天気予報）", sentence:"天気予報によると、来週は＿＿＿＿。", answer:"寒いそうです"},

const grammarKeys = Object.keys(DATA);
let activeGrammar = grammarKeys[0];
let activeSubtab = {};
grammarKeys.forEach(k => { activeSubtab[k] = "pg"; });

// state per grammar for PG quiz
grammarKeys.forEach(k => {
    DATA[k].current = 0;
    DATA[k].picked = DATA[k].pg.map(() => null);
});

const letters = ["A","B","C","D"];
const grammarTabsEl = document.getElementById("grammarTabs");
const grammarSectionsEl = document.getElementById("grammarSections");

function buildConjTableHtml(g){
    let rowsHtml = "";
    g.table.rows.forEach(row => {
        const examplesHtml = row.examples.map(ex =>
            `<div class="conj-ex-row jp"><span>${ex.dict}</span><span class="arrow">(${ex.masu})</span><span class="arrow">→</span><span class="final">${ex.form}</span></div>`
        ).join("");
        rowsHtml += `
            <tr>
                <td class="conj-gol-cell">${row.gol}</td>
                <td class="conj-note-cell">${row.note}</td>
                <td><div class="conj-examples">${examplesHtml}</div></td>
            </tr>
        `;
    });
    return `
        <div class="conj-table-wrap">
            <div class="conj-table-title">📐 Tabel Perubahan Kosakata → ${g.label}</div>
            <div class="conj-table-rule">${g.table.rule}</div>
            <table class="conj-table">
                <thead>
                    <tr><th>Kategori</th><th>Aturan</th><th>Contoh</th></tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
            </table>
        </div>
    `;
}

function buildGrammarTabs(){
    grammarTabsEl.innerHTML = "";
    grammarKeys.forEach(k => {
        const btn = document.createElement("button");
        btn.className = "gtab" + (k === activeGrammar ? " active" : "");
        btn.textContent = DATA[k].label;
        btn.addEventListener("click", () => { activeGrammar = k; renderAll(); });
        grammarTabsEl.appendChild(btn);
    });
}

function buildSections(){
    grammarSectionsEl.innerHTML = "";
    grammarKeys.forEach(k => {
        const section = document.createElement("div");
        section.className = "grammar-section" + (k === activeGrammar ? " active" : "");
        section.id = "sec-" + k;

        section.innerHTML = `
            <div class="gram-intro">${DATA[k].intro}</div>
            ${buildConjTableHtml(DATA[k])}
            <div class="subtab-row" id="subtabs-${k}">
                <button class="subtab" data-sub="pg">✅ Pilihan Ganda</button>
                <button class="subtab" data-sub="essay">✍️ Esai</button>
                <button class="subtab" data-sub="transform">🔄 Merubah Kalimat</button>
            </div>
            <div class="subpanel" id="panel-${k}-pg"></div>
            <div class="subpanel" id="panel-${k}-essay"></div>
            <div class="subpanel" id="panel-${k}-transform"></div>
        `;
        grammarSectionsEl.appendChild(section);

        section.querySelectorAll(".subtab").forEach(btn => {
            btn.addEventListener("click", () => {
                activeSubtab[k] = btn.dataset.sub;
                renderSubtabs(k);
            });
        });
    });
}

function renderSubtabs(k){
    const row = document.getElementById("subtabs-" + k);
    row.querySelectorAll(".subtab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.sub === activeSubtab[k]);
    });
    ["pg","essay","transform"].forEach(sub => {
        const panel = document.getElementById("panel-" + k + "-" + sub);
        panel.classList.toggle("active", sub === activeSubtab[k]);
    });
    if(activeSubtab[k] === "pg") renderPG(k);
    if(activeSubtab[k] === "essay") renderEssay(k);
    if(activeSubtab[k] === "transform") renderTransform(k);
}

//===================== PG =====================
function renderPG(k){
    const g = DATA[k];
    const q = g.pg[g.current];
    const picked = g.picked[g.current];
    const panel = document.getElementById("panel-" + k + "-pg");

    let optionsHtml = "";
    q.options.forEach((opt, i) => {
        let cls = "opt-btn";
        let disabled = "";
        if(picked !== null){
            disabled = "disabled";
            if(i === q.answer) cls += " correct";
            else if(i === picked) cls += " wrong";
            else cls += " dim";
        }
        optionsHtml += `<button class="${cls}" ${disabled} data-i="${i}"><span class="opt-letter">${letters[i]}</span><span class="jp">${opt}</span></button>`;
    });

    let feedbackHtml = "";
    if(picked !== null){
        const isCorrect = picked === q.answer;
        feedbackHtml = `<div class="feedback show ${isCorrect ? "correct-fb" : "wrong-fb"}">${isCorrect ? "✔ Jawaban benar!" : "✘ Jawaban salah. Jawaban yang benar: " + q.options[q.answer]}</div>`;
    }

    let dotsHtml = "";
    g.pg.forEach((qq, i) => {
        let cls = "dot" + (i === g.current ? " active" : "");
        if(g.picked[i] !== null) cls += (g.picked[i] === qq.answer ? " correct" : " wrong");
        dotsHtml += `<button class="${cls}" data-jump="${i}">${i+1}</button>`;
    });

    const doneCount = g.picked.filter(p => p !== null).length;
    const correctCount = g.pg.filter((qq,i) => g.picked[i] === qq.answer).length;

    panel.innerHTML = `
        <div class="progress-row">
            <span class="progress-text">${g.current+1} / ${g.pg.length}</span>
            <div class="progress-bar"><div class="progress-fill" style="width:${(g.current+1)/g.pg.length*100}%"></div></div>
        </div>
        <div class="card">
            <div class="badge jp">文</div>
            <div class="word jp">${q.word}</div>
            <div class="subtext">${q.sub}</div>
            <div class="options-grid">${optionsHtml}</div>
            ${feedbackHtml}
        </div>
        <div class="nav-row">
            <button class="nav-btn" id="pgPrev-${k}" ${g.current===0?"disabled":""}>←</button>
            <button class="nav-btn reset-btn" id="pgReset-${k}">↺ Ulang</button>
            <button class="nav-btn" id="pgNext-${k}" ${g.current===g.pg.length-1?"disabled":""}>→</button>
        </div>
        <div class="jump-row">${dotsHtml}</div>
        <div class="pg-score">Terjawab: ${doneCount}/${g.pg.length} &nbsp;|&nbsp; Benar: ${correctCount}</div>
    `;

    panel.querySelectorAll(".opt-btn:not([disabled])").forEach(btn => {
        btn.addEventListener("click", () => {
            const i = parseInt(btn.dataset.i, 10);
            g.picked[g.current] = i;
            renderPG(k);
        });
    });
    panel.querySelectorAll("[data-jump]").forEach(btn => {
        btn.addEventListener("click", () => { g.current = parseInt(btn.dataset.jump,10); renderPG(k); });
    });
    const prevBtn = document.getElementById("pgPrev-"+k);
    const nextBtn = document.getElementById("pgNext-"+k);
    const resetBtn = document.getElementById("pgReset-"+k);
    if(prevBtn) prevBtn.addEventListener("click", () => { if(g.current>0){ g.current--; renderPG(k);} });
    if(nextBtn) nextBtn.addEventListener("click", () => { if(g.current<g.pg.length-1){ g.current++; renderPG(k);} });
    if(resetBtn) resetBtn.addEventListener("click", () => {
        if(confirm("Ulang soal pilihan ganda " + g.label + "?")){
            g.current = 0;
            g.picked = g.pg.map(() => null);
            renderPG(k);
        }
    });
}

//===================== ESSAY =====================
function renderEssay(k){
    const g = DATA[k];
    const panel = document.getElementById("panel-" + k + "-essay");
    let html = `<div class="item-list">`;
    g.essay.forEach((item, i) => {
        html += `
            <div class="item-card">
                <div class="item-prompt jp"><span class="item-num">${i+1}</span>（${item.cue}）</div>
                <div class="item-sentences jp"><span>${item.sentence}</span></div>
                <input type="text" class="item-textarea jp" style="min-height:auto;" placeholder="Tulis jawabanmu di sini...">
                <button class="reveal-btn" data-target="essay-ans-${k}-${i}">💡 Lihat jawaban</button>
                <div class="answer-box jp" id="essay-ans-${k}-${i}">${item.answer}</div>
            </div>
        `;
    });
    html += `</div>`;
    panel.innerHTML = html;

    panel.querySelectorAll(".reveal-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const box = document.getElementById(btn.dataset.target);
            box.classList.toggle("show");
            btn.textContent = box.classList.contains("show") ? "🙈 Sembunyikan jawaban" : "💡 Lihat jawaban";
        });
    });
}

//===================== TRANSFORM =====================
function renderTransform(k){
    const g = DATA[k];
    const panel = document.getElementById("panel-" + k + "-transform");
    let html = `<div class="item-list">`;
    g.transform.forEach((item, i) => {
        const instruksi = item.parts.length > 1
            ? `Gabungkan kalimat berikut menggunakan pola <span class="jp" style="font-weight:900;">${g.label}</span>:`
            : `Ubah kalimat berikut menggunakan pola <span class="jp" style="font-weight:900;">${g.label}</span>:`;
        html += `
            <div class="item-card">
                <div class="item-prompt">
                    <span class="item-num">${i+1}</span>
                    ${instruksi}
                </div>
                <div class="item-sentences jp">
                    ${item.parts.map(p => `<span>${p}</span>`).join("")}
                </div>
                <textarea class="item-textarea jp" placeholder="Tulis jawabanmu di sini..."></textarea>
                <button class="reveal-btn" data-target="tf-ans-${k}-${i}">💡 Lihat jawaban</button>
                <div class="answer-box jp" id="tf-ans-${k}-${i}">${item.answer}</div>
            </div>
        `;
    });
    html += `</div>`;
    panel.innerHTML = html;

    panel.querySelectorAll(".reveal-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const box = document.getElementById(btn.dataset.target);
            box.classList.toggle("show");
            btn.textContent = box.classList.contains("show") ? "🙈 Sembunyikan jawaban" : "💡 Lihat jawaban";
        });
    });
}

function renderAll(){
    buildGrammarTabs();
    buildSections();
    grammarKeys.forEach(k => renderSubtabs(k));
}

renderAll();

</script>
