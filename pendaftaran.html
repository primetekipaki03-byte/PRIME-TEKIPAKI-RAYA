<!-- ================= DATA PRIBADI ================= -->
<div class="card">
  <div class="card-head">
    <div class="icon"><i class="fas fa-user"></i></div>
    <h3>Data Pribadi</h3>
    <span class="badge">Step 1</span>
  </div>

  <div class="card-body">

    <div class="form-group" style="margin-bottom:16px">
      <label>Program yang Dipilih <span class="req">*</span></label>

      <div class="prog-select">
        <label class="prog-label" id="lbl-toku">
          <input type="radio" name="program" id="prog-toku" value="Tokutei Ginou">
          <span>
            <strong>Tokutei Ginou</strong>
            <span class="sub">特定技能 — Specified Skilled Worker</span>
          </span>
        </label>

        <label class="prog-label" id="lbl-jiss">
          <input type="radio" name="program" id="prog-jiss" value="Jisshusei">
          <span>
            <strong>Jisshusei</strong>
            <span class="sub">技能実習生 — Technical Intern</span>
          </span>
        </label>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:16px">
      <label>Nama Lengkap <span class="req">*</span></label>
      <input type="text" id="namaRomaji" placeholder="Nama lengkap sesuai KTP / dokumen resmi">
    </div>

    <div class="grid-3" style="margin-bottom:16px">
      <div class="form-group">
        <label>Jenis Kelamin <span class="req">*</span></label>
        <select id="jenisKelamin">
          <option value="">Pilih</option>
          <option>Laki-laki</option>
          <option>Perempuan</option>
        </select>
      </div>

      <div class="form-group">
        <label>Status Menikah</label>
        <select id="statusMenikah">
          <option value="">Pilih</option>
          <option>Belum Menikah</option>
          <option>Menikah</option>
          <option>Cerai</option>
        </select>
      </div>

      <div class="form-group">
        <label>Golongan Darah</label>
        <select id="golDarah">
          <option value="">Pilih</option>
          <option>A</option>
          <option>B</option>
          <option>O</option>
          <option>AB</option>
        </select>
      </div>
    </div>

    <!-- TEMPAT LAHIR SUDAH DIPINDAH KE DATA PRIBADI -->
    <div class="grid-4" style="margin-bottom:16px">

      <div class="form-group">
        <label>Kewarganegaraan <span class="req">*</span></label>
        <input type="text" id="kewarganegaraan" value="Indonesia">
      </div>

      <div class="form-group">
        <label>Tempat Lahir <span class="req">*</span></label>
        <input type="text" id="tempatLahir" placeholder="Kota/Kabupaten tempat lahir">
      </div>

      <div class="form-group">
        <label>Tanggal Lahir <span class="req">*</span></label>
        <input type="date" id="tanggalLahir">
      </div>

      <div class="form-group">
        <label>Agama</label>
        <select id="agama">
          <option value="">Pilih</option>
          <option>Islam</option>
          <option>Kristen</option>
          <option>Katolik</option>
          <option>Hindu</option>
          <option>Buddha</option>
          <option>Konghucu</option>
        </select>
      </div>

    </div>

  </div>
</div>

<!-- ================= ALAMAT ================= -->
<div class="card">
  <div class="card-head">
    <div class="icon"><i class="fas fa-map-marker-alt"></i></div>
    <h3>Alamat</h3>
    <span class="badge">Step 2</span>
  </div>

  <div class="card-body">

    <div class="form-group">
      <label>Alamat Lengkap <span class="req">*</span></label>

      <textarea id="alamatLengkap" rows="3"
      placeholder="Jl. ..., RT/RW, Kelurahan, Kecamatan, Kota, Provinsi, Kode Pos"></textarea>
    </div>

  </div>
</div>

<!-- ================= TARGET NABUNG ================= -->
<div class="grid-2" style="margin-bottom:16px">

  <div class="form-group">
    <label>Hobi</label>
    <input type="text" id="hobi" placeholder="Membaca, olahraga, memasak...">
  </div>

  <div class="form-group">
    <label>Target Nabung</label>
    <input type="text" id="targetGaji" placeholder="5.000.000">
  </div>

</div>

<script>

// ================= FORMAT RUPIAH =================
function formatRupiah(input){
  if(!input) return;

  input.addEventListener('input', function(){

    let value = this.value.replace(/\D/g,'');

    this.value = value.replace(/\B(?=(\d{3})+(?!\d))/g,'.');

  });
}

// ================= ADD KELUARGA =================
function addKeluarga(
  hubungan='',
  nama='',
  umur='',
  pekerjaan='',
  gaji=''
){

  const n = el('keluargaContainer').children.length + 1;

  const block = addBlock('keluargaContainer',`

    <div class="grid-2" style="margin-bottom:10px">

      <div class="form-group">
        <label>Hubungan</label>

        <select class="kHub">
          <option value="">Pilih</option>

          <option ${hubungan=='Ayah'?'selected':''}>Ayah</option>
          <option ${hubungan=='Ibu'?'selected':''}>Ibu</option>

          <option>Suami</option>
          <option>Istri</option>
          <option>Kakak</option>
          <option>Adik</option>
          <option>Anak</option>
          <option>Lainnya</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nama Lengkap</label>

        <input type="text"
        class="kNama"
        value="${nama}"
        placeholder="Nama anggota keluarga">
      </div>

    </div>

    <div class="grid-3">

      <div class="form-group">
        <label>Umur</label>

        <input type="number"
        class="kUmur"
        value="${umur}"
        placeholder="45">
      </div>

      <div class="form-group">
        <label>Pekerjaan</label>

        <input type="text"
        class="kPekerjaan"
        value="${pekerjaan}"
        placeholder="Wiraswasta">
      </div>

      <div class="form-group">
        <label>Penghasilan (Rp/Bulan)</label>

        <input type="text"
        class="kGaji"
        value="${gaji}"
        placeholder="5.000.000">
      </div>

    </div>

  `,`Anggota Keluarga #${n}`);

  // FORMAT RUPIAH OTOMATIS
  formatRupiah(block.querySelector('.kGaji'));
}

// ================= INIT =================
document.addEventListener('DOMContentLoaded',()=>{

  addPendidikan();

  addKeluarga('Ayah');
  addKeluarga('Ibu');

  // TARGET NABUNG FORMAT RUPIAH
  formatRupiah(el('targetGaji'));

});

</script>
