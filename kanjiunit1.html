<style>

:root{
    --navy:#001f3f;
    --navy2:#002a54;
    --gold:#facc15;
    --text:#001f3f;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    background:#ffffff;
    color:var(--text);
}

/* =======================
        NAVBAR
======================= */

#navbar{
    position:sticky;
    top:0;
    z-index:999;
    background:#001530;
    border-bottom:2px solid rgba(250,204,21,.25);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
}

.navbar-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
}

.nav-left{
    display:flex;
    align-items:center;
}

.nav-right{
    display:flex;
    gap:8px;
    align-items:center;
}

.home-btn{

display:flex;
align-items:center;
gap:8px;

background:var(--gold);
color:#001530;

text-decoration:none;

padding:8px 14px;

border-radius:10px;

font-weight:bold;

}

.home-btn:hover{

opacity:.85;

}

.home-icon{

width:24px;

height:24px;

object-fit:cover;

border-radius:4px;

}

.dropdown{

position:relative;

}

.dropdown-btn{

background:none;

border:2px solid var(--gold);

color:var(--gold);

padding:8px 14px;

border-radius:8px;

font-weight:bold;

cursor:pointer;

}

.dropdown-btn:hover{

background:var(--gold);

color:#001530;

}

.dropdown-menu{

display:none;

position:absolute;

top:45px;

left:0;

background:#022655;

border-radius:10px;

overflow:hidden;

min-width:220px;

box-shadow:0 8px 20px rgba(0,0,0,.4);

}

.dropdown-menu a{

display:block;

padding:12px 15px;

color:#ffd700;

text-decoration:none;

}

.dropdown-menu a:hover{

background:var(--gold);

color:#001530;

}

.show{

display:block;

}

.nav-link-btn{

text-decoration:none;

padding:8px 14px;

border:2px solid var(--gold);

color:var(--gold);

border-radius:8px;

font-weight:bold;

}

.nav-link-btn:hover{

background:var(--gold);

color:#001530;

}

/* =======================
       HEADER
======================= */

header{

text-align:center;

padding:40px 20px;

}

header h1{

font-size:46px;

color:#001f3f;

margin-bottom:10px;

}

header p{

font-size:18px;

color:#555;

}

/* =======================
     FLASH CARD
======================= */

.viewer{

max-width:900px;

margin:20px auto;

border:4px solid #001f3f;

border-radius:20px;

height:330px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:white;

}

#kanji{

font-size:130px;

font-weight:bold;

}

#hiragana{

font-size:38px;

margin-top:10px;

}

.big{

animation:zoom .3s;

}

@keyframes zoom{

0%{

transform:scale(.5);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}

/* =======================
        GRID
======================= */

.grid{

max-width:1200px;

margin:40px auto;

display:grid;

grid-template-columns:repeat(5,1fr);

gap:20px;

padding:20px;

}

.card{

border:2px solid #001f3f;

border-radius:15px;

padding:25px;

cursor:pointer;

transition:.25s;

text-align:center;

}

.card:hover{

background:#043668;

color:white;

transform:translateY(-5px);

}

.card .j{

font-size:42px;

font-weight:bold;

}

.card .h{

margin-top:10px;

font-size:20px;

}

@media(max-width:768px){

.grid{

grid-template-columns:repeat(2,1fr);

}

#kanji{

font-size:90px;

}

}

</style>
</head>

<header>

<h1>漢字フラッシュカード</h1>


</header>

<div class="viewer">

<div id="kanji" class="big">

消火

</div>

<div id="hiragana"></div>

</div>

<div class="grid">
        <div class="card" onclick="show('消火','しょうか')">
        <div class="j">消火</div>
     
    </div>

    <div class="card" onclick="show('食事','しょくじ')">
        <div class="j">食事</div>
    
    </div>

    <div class="card" onclick="show('曲がる','まがる')">
        <div class="j">曲がる</div>
    
    </div>

    <div class="card" onclick="show('渡る','わたる')">
        <div class="j">渡る</div>
       
    </div>

    <div class="card" onclick="show('迷う','まよう')">
        <div class="j">迷う</div>
     
    </div>

    <div class="card" onclick="show('入口','いりぐち')">
        <div class="j">入口</div>
    </div>

    <div class="card" onclick="show('直す','なおす')">
        <div class="j">直す</div>

    </div>

        <div class="j">病院</div>
       
    </div>

        <div class="j">出る</div>
    
    </div>

    </div>

<script>

//============================
// FLASH CARD
//============================

function show(kanji,hira){

    document.getElementById("kanji").innerHTML=kanji;
    document.getElementById("hiragana").innerHTML=hira;

    let x=document.getElementById("kanji");

    x.classList.remove("big");

    void x.offsetWidth;

    x.classList.add("big");

}

//============================
// DROPDOWN
//============================

function toggleDropdown(id){

    document.querySelectorAll(".dropdown-menu").forEach(function(menu){

        if(menu.id!=id){

            menu.classList.remove("show");

        }

    });

    document.getElementById(id).classList.toggle("show");

}

document.addEventListener("click",function(e){

    if(!e.target.closest(".dropdown")){

        document.querySelectorAll(".dropdown-menu").forEach(function(menu){

            menu.classList.remove("show");

        });

    }

});

//============================
// PROTEKSI
//============================

document.addEventListener("contextmenu",e=>e.preventDefault());

document.addEventListener("copy",e=>e.preventDefault());

document.addEventListener("cut",e=>e.preventDefault());

document.addEventListener("selectstart",e=>e.preventDefault());

document.addEventListener("dragstart",e=>e.preventDefault());

document.addEventListener("keydown",function(e){

if(
(e.ctrlKey&&["c","u","s","p"].includes(e.key.toLowerCase()))
||
e.key==="F12"
||
(e.ctrlKey&&e.shiftKey&&["i","j","c"].includes(e.key.toLowerCase()))
){

e.preventDefault();

}

});

</script>
